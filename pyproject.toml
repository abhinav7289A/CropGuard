[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropguard"
version = "0.1.0"
description = "Production MLOps pipeline for crop disease detection (PlantVillage, 38 classes)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training environment (Lightning AI studio / Colab / local GPU)
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pytorch-lightning>=2.2",
    "timm>=1.0",
    "wandb>=0.17",
    "scikit-learn>=1.4",
    "huggingface_hub>=0.23",
    "mlflow>=2.12",
    "onnx>=1.16",
    "onnxscript>=0.1",  # required by torch>=2.6's default (dynamo) ONNX exporter
    "onnxruntime>=1.17",  # ONNX parity check after export
    "torchmetrics>=1.3",
]
# Data acquisition & validation
data = [
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "scikit-learn>=1.4",
    "imagehash>=4.3",
    "tqdm>=4.66",
]
# Serving environment (Render free tier — CPU only, no torch)
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "onnxruntime>=1.17",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.2",
]
# Statistical evaluation of saved predictions — deliberately torch-free so hypothesis
# tests and reports can run on any machine, including CI.
eval = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a function call in an argument default.
"src/cropguard/serving/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Challenger: ConvNeXt-Tiny, heavy augmentation.
#
# These values are the timm/ConvNeXt reference recipe (low LR, high weight decay, heavy
# augmentation), not the output of a search — no sweep has been run. Seven settings differ
# from the baseline, so an A/B against it answers "which configuration should ship" and not
# "which architecture is better".
extends: base.yaml

experiment_name: convnext-tiny-challenger

model:
  name: convnext_tiny
  pretrained: true
  dropout: 0.3

train:
  epochs: 30
  batch_size: 48
  lr: 1.0e-4
  weight_decay: 5.0e-2

augmentation: heavy

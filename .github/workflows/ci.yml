name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU wheels only — the GitHub runner has no GPU and the CUDA build blows the disk quota.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[data,serve,eval,dev]"
          # timm and Lightning are train-only, but the ONNX export and logger-fallback tests
          # need them. Without these, importorskip silently skipped 6 tests — including the
          # regression test for the INT8 quantization bug — and CI still reported green.
          python -m pip install timm pytorch-lightning torchmetrics
      # -rs reports skip reasons, so a dependency quietly disappearing shows up in the log
      # rather than hiding behind a passing run.
      - name: Test
        run: python -m pytest -q -rs
      - name: Fail if the ONNX export tests were skipped
        run: |
          python -m pytest tests/test_onnx_export.py --collect-only -q > /dev/null
          python -m pytest tests/test_onnx_export.py -q 2>&1 | tee /tmp/onnx.log
          if grep -qE "[0-9]+ skipped" /tmp/onnx.log; then
            echo "::error::ONNX export tests skipped — a train-only dependency is missing"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      # classes.json is generated by the data split and is not committed; the build needs a
      # placeholder so the serving image is verifiable before the first training run.
      - name: Ensure classes.json exists
        run: |
          test -f configs/classes.json || echo '["placeholder"]' > configs/classes.json
      - uses: docker/setup-buildx-action@v3
      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cropguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name cropguard -p 8000:8000 cropguard:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          # No model is baked in, so the API must report degraded — not crash.
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"degraded"'
          docker rm -f cropguard
